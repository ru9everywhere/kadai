<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>今日の学食</title>
</head>
<body>

    <header class="site-header">
        <p class="eyebrow">TCU YOKOHAMA CAMPUS</p>
        <h1>今日の学食</h1>
        <p class="sub">学生食堂・7号館CAFE のメニューから、今日のごはんを決めよう</p>
        <p id="date-label" class="date-chip"></p>
    </header>

    <main>
        <section class="panel roulette-panel">
            <div class="panel-head">
                <h2>メニューダーツ</h2>
                <button id="sound-button" class="ghost-btn">音 ON</button>
            </div>

            <div class="roulette-body">
                <div id="wheel-area" class="wheel-area">
                    <div id="board" class="board">
                        <canvas id="wheel"></canvas>
                        <div id="hub" class="hub">GO</div>
                    </div>
                </div>

                <div class="result-area">
                    <p class="result-label">今日のあなたは…</p>
                    <p id="roulette-display">？</p>
                    <div id="roulette-info"></div>
                    <div class="roulette-buttons">
                        <button id="roulette-button" class="main-btn">回す</button>
                    </div>
                    <p class="hint">回っている間にクリックすると、その場所にダーツが飛びます（スペースキーならカーソルの位置へ）</p>
                    <ul class="legend">
                        <li><span class="dot shop-a"></span>学生食堂</li>
                        <li><span class="dot shop-b"></span>7号館CAFE</li>
                    </ul>
                </div>
            </div>
        </section>

        <div class="choose-grid">
            <section class="panel">
                <div class="panel-head">
                    <h2>予算でおまかせ</h2>
                </div>
                <p class="panel-text">予算内でメイン＋サイドやドリンクを組み合わせます</p>
                <div class="choice-buttons">
                    <button class="choice-btn budget-btn" data-budget="500">500円</button>
                    <button class="choice-btn budget-btn" data-budget="1000">1000円</button>
                    <button class="choice-btn budget-btn" data-budget="5000">5000円</button>
                </div>
                <div id="budget-result" class="plan" hidden>
                    <ul id="budget-list" class="plan-list"></ul>
                    <div class="meter"><div id="budget-meter" class="meter-bar"></div></div>
                    <p id="budget-total" class="plan-total"></p>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>カロリーでおまかせ</h2>
                </div>
                <p class="panel-text">指定したカロリー以内でメニューを組み合わせます</p>
                <div class="choice-buttons">
                    <button class="choice-btn kcal-btn" data-kcal="500">500kcal</button>
                    <button class="choice-btn kcal-btn" data-kcal="1000">1000kcal</button>
                    <button class="choice-btn kcal-btn" data-kcal="1500">1500kcal</button>
                </div>
                <div id="kcal-result" class="plan" hidden>
                    <ul id="kcal-list" class="plan-list"></ul>
                    <div class="meter"><div id="kcal-meter" class="meter-bar green"></div></div>
                    <p id="kcal-total" class="plan-total"></p>
                </div>
            </section>
        </div>

        <section class="menu-section">
            <div class="menu-head">
                <h2>今日のメニュー</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-shop="all">すべて</button>
                    <button class="filter-btn" data-shop="学生食堂">学生食堂</button>
                    <button class="filter-btn" data-shop="7号館CAFE">7号館CAFE</button>
                </div>
            </div>
            <div id="menu-area"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>メニュー・価格・カロリーは東京都市大学 学食メニュー表をもとにしています</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
